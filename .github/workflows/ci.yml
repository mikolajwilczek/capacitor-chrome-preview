name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  checks:
    name: Node 24
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Smoke-test packed package
        shell: bash
        run: |
          package_file="$(npm pack --silent --ignore-scripts --pack-destination "$RUNNER_TEMP")"
          smoke_dir="$(mktemp -d "$RUNNER_TEMP/package-smoke.XXXXXX")"
          npm install --prefix "$smoke_dir" --ignore-scripts "$RUNNER_TEMP/$package_file"
          "$smoke_dir/node_modules/.bin/capacitor-chrome-preview" --help
